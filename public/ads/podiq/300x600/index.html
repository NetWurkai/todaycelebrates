<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="ad.size" content="width=300,height=600">
<title>PodIQ 300x600</title>
<style>
@font-face{font-family:Inter;font-weight:700;font-display:block;src:url(../shared/fonts/inter-700.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:500;font-display:block;src:url(../shared/fonts/jakarta-500.woff2) format("woff2")}
html,body{margin:0;padding:0;background:transparent}
#ad{width:300px;height:600px;cursor:pointer;overflow:hidden}
.wave{clip-path:inset(0 100% 0 0);animation:reveal 1.1s .3s cubic-bezier(.3,.7,.2,1) forwards}
.cta{animation:pop .5s 1.2s both}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes pop{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wave,.cta{animation:none;clip-path:none}}
</style>
<script>var clickTag = "https://podiq.ai";</script>
</head><body>
<div id="ad" role="link" aria-label="PodIQ: Launch your podcast">
<div style="position: relative; width: 300px; height: 600px; box-sizing: border-box; background: #1E1B4B; border: 1px solid #26235A; overflow: hidden; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<img src="../shared/mark.png" alt="" aria-hidden="true" style="position: absolute; right: -70px; bottom: 30px; height: 400px; width: auto; opacity: 0.06">
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; justify-content: space-between">
<img src="../shared/logo.png" alt="PodIQ" style="width: 140px; height: auto; display: block">
<div style="display: flex; flex-direction: column; gap: 22px">
<svg class="wave" width="236" height="100" viewBox="0 0 236 100" fill="#A59EFF" aria-hidden="true"><rect x="0" y="21.1" width="4" height="57.8" rx="2"/><rect x="8" y="12" width="4" height="75.9" rx="2"/><rect x="16" y="8.9" width="4" height="82.2" rx="2"/><rect x="24" y="11.6" width="4" height="76.7" rx="2"/><rect x="32" y="17" width="4" height="65.9" rx="2"/><rect x="40" y="20.8" width="4" height="58.4" rx="2"/><rect x="48" y="20.2" width="4" height="59.6" rx="2"/><rect x="56" y="15.5" width="4" height="69.1" rx="2"/><rect x="64" y="9.9" width="4" height="80.3" rx="2"/><rect x="72" y="7.6" width="4" height="84.7" rx="2"/><rect x="80" y="11.8" width="4" height="76.4" rx="2"/><rect x="88" y="21.8" width="4" height="56.4" rx="2"/><rect x="96" y="33.9" width="4" height="32.3" rx="2"/><rect x="104" y="42" width="4" height="16" rx="2"/><rect x="112" y="42" width="4" height="16" rx="2"/><rect x="120" y="37.9" width="4" height="24.3" rx="2"/><rect x="128" y="26.2" width="4" height="47.5" rx="2"/><rect x="136" y="14.6" width="4" height="70.7" rx="2"/><rect x="144" y="7.8" width="4" height="84.4" rx="2"/><rect x="152" y="7.6" width="4" height="84.8" rx="2"/><rect x="160" y="12.5" width="4" height="75.1" rx="2"/><rect x="168" y="18.4" width="4" height="63.3" rx="2"/><rect x="176" y="21.2" width="4" height="57.6" rx="2"/><rect x="184" y="19.4" width="4" height="61.2" rx="2"/><rect x="192" y="14.5" width="4" height="71.1" rx="2"/><rect x="200" y="10.2" width="4" height="79.5" rx="2"/><rect x="208" y="10.8" width="4" height="78.5" rx="2"/><rect x="216" y="17.5" width="4" height="65.1" rx="2"/><rect x="224" y="28.5" width="4" height="43" rx="2"/><rect x="232" y="39.1" width="4" height="21.7" rx="2"/></svg>
<h1 style="margin: 0; font-family: Inter, system-ui, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; color: #FFFFFF">Podcast production at the speed of thought.</h1>
<p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45; color: #B8B6D6">Research, prep, SEO, RSS: one pipeline, zero busywork.</p>
</div>
<span class="cta" style="display: block; text-align: center; background: #A59EFF; color: #1E1B4B; font-family: Inter, system-ui, sans-serif; font-weight: 700; font-size: 16px; line-height: 1; padding: 17px 24px; border-radius: 999px">Launch your podcast</span>
</div>
</div>
</div>
<script>document.getElementById("ad").addEventListener("click",function(){window.open(window.clickTag,"_blank")});</script>
</body></html>
