<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="ad.size" content="width=320,height=50">
<title>PodIQ 320x50</title>
<style>
@font-face{font-family:Inter;font-weight:700;font-display:block;src:url(../shared/fonts/inter-700.woff2) format("woff2")}
html,body{margin:0;padding:0;background:transparent}
#ad{width:320px;height:50px;cursor:pointer;overflow:hidden}
.wave{clip-path:inset(0 100% 0 0);animation:reveal 1.1s .3s cubic-bezier(.3,.7,.2,1) forwards}
.cta{animation:pop .5s 1.2s both}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes pop{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wave,.cta{animation:none;clip-path:none}}
</style>
<script>var clickTag = "https://podiq.ai";</script>
</head><body>
<div id="ad" role="link" aria-label="PodIQ: Launch your podcast">
<div style="width: 320px; height: 50px; box-sizing: border-box; background: #1E1B4B; border: 1px solid #26235A; overflow: hidden; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<img src="../shared/logo.png" alt="PodIQ" style="width: 120px; height: auto; display: block; flex-shrink: 0">
<span class="cta" style="display: inline-block; flex-shrink: 0; background: #A59EFF; color: #1E1B4B; font-family: Inter, system-ui, sans-serif; font-weight: 700; font-size: 12px; line-height: 1; padding: 11px 14px; border-radius: 999px; white-space: nowrap">Launch your podcast</span>
</div>
</div>
<script>document.getElementById("ad").addEventListener("click",function(){window.open(window.clickTag,"_blank")});</script>
</body></html>
