<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Celebrates</title>
<link rel="canonical" href="https://todaycelebrates.com/">
<meta name="description" content="A daily calendar of national, international, and world holidays and observances.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ff6b45" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#ff8a63" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg: #f6f4f0;
    --card: #ffffff;
    --ink: #1c1a17;
    --muted: #6b665c;
    --accent: #ff6b45;
    --accent-ink: #7a2c12;
    --accent-soft: #ffe9df;
    --teal: #1fb6a4;
    --line: #ece7dd;
    --today-ring: #ff6b45;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #121110;
      --card: #1c1a17;
      --ink: #f4f1ea;
      --muted: #a9a296;
      --accent: #ff8a63;
      --accent-ink: #ffe3d6;
      --accent-soft: #3a241c;
      --teal: #35d6c1;
      --line: #34302a;
      --today-ring: #ff8a63;
    }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height: 88vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    background-size:cover;
    background-position:center;
    overflow:hidden;
    padding: 24px 24px 120px;
    color:#fff;
    transition: background-image 0.4s ease;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(10,8,6,0.55) 0%, rgba(10,8,6,0.25) 30%, rgba(10,8,6,0.75) 78%, rgba(10,8,6,0.95) 100%),
      radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);
  }
  .hero-topbar{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:auto;
  }
  .logo{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size: 1.15rem;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .logo .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  .hero-date-badge{
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(6px);
    padding:7px 14px;
    border-radius:999px;
  }
  .hero-content{
    position:relative;
    z-index:2;
    max-width: 780px;
  }
  .hero-eyebrow{
    font-size:0.82rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-weight:800;
    color:var(--accent);
    margin-bottom:12px;
  }
  .hero-headline{
    font-size: clamp(2.1rem, 5.6vw, 4rem);
    font-weight:900;
    line-height:1.04;
    letter-spacing:-0.02em;
    margin: 0 0 16px;
    text-wrap: balance;
  }
  .hero-headline a{
    color: inherit;
    text-decoration: none;
  }
  .hero-headline a:hover{
    text-decoration: underline;
  }
  .hero-sub{
    font-size: 1.05rem;
    color: rgba(255,255,255,0.88);
    margin: 0 0 22px;
    max-width: 60ch;
  }
  .hero-more{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:1px solid rgba(255,255,255,0.5);
    color:#fff;
    font-size:0.88rem;
    font-weight:700;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
  }
  .hero-more:hover{
    background:rgba(255,255,255,0.12);
  }

  /* ---------- Calendar card ---------- */
  .content-wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .cal-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding: 22px;
    margin-top: -78px;
    position:relative;
    z-index:3;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
  }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 16px;
  }
  .cal-header h2{
    font-size:1.05rem;
    margin:0;
    font-weight:800;
  }
  .cal-nav{
    display:flex;
    gap:8px;
  }
  .cal-nav button{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    width:32px;height:32px;
    border-radius:10px;
    cursor:pointer;
    font-size:1rem;
  }
  .cal-nav button:hover{
    background:var(--accent-soft);
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:4px;
  }
  .dow{
    text-align:center;
    font-size:0.7rem;
    color:var(--muted);
    font-weight:700;
    text-transform:uppercase;
    padding-bottom:6px;
  }
  .day{
    aspect-ratio: 1;
    border-radius:12px;
    border:1px solid transparent;
    background: transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:0.88rem;
    color:var(--ink);
    position:relative;
    min-height: 38px;
    font-family:inherit;
  }
  .day:hover{
    background:var(--accent-soft);
  }
  .day.empty{
    cursor:default;
    visibility:hidden;
  }
  .day.has-data::after{
    content:"";
    width:5px;height:5px;
    border-radius:50%;
    background:var(--accent);
    position:absolute;
    bottom:5px;
  }
  .day.today{
    border-color: var(--today-ring);
    font-weight:800;
  }
  .day.selected{
    background:var(--accent);
    color:#fff;
  }
  .day.selected::after{
    background:#fff;
  }

  /* ---------- Today's full list ---------- */
  .list-section{
    margin-top: 34px;
  }
  .list-section h3{
    font-size:1rem;
    font-weight:800;
    margin: 0 0 4px;
  }
  .list-section .list-sub{
    color:var(--muted);
    font-size:0.88rem;
    margin: 0 0 16px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius: 999px;
    padding: 9px 15px;
    font-size:0.88rem;
    font-weight:600;
    line-height:1.2;
    display:inline-block;
    text-decoration:none;
    cursor:pointer;
  }
  .chip:hover{
    border-color:var(--accent);
  }
  .chip.lead{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .empty-note{
    color:var(--muted);
    font-size:0.9rem;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    padding: 8px 20px 40px;
  }
</style>
</head>
<body>

  <section class="hero" id="hero">
    <div class="hero-topbar">
      <div class="logo"><span class="dot"></span>Today Celebrates</div>
      <div class="hero-date-badge" id="heroDateBadge">—</div>
    </div>
    <div class="hero-content">
      <div class="hero-eyebrow" id="heroEyebrow">Leading celebration</div>
      <h1 class="hero-headline" id="heroHeadline">—</h1>
      <p class="hero-sub" id="heroSub"></p>
      <button class="hero-more" id="heroMoreBtn" type="button">See all today's celebrations ↓</button>
    </div>
  </section>

  <div class="content-wrap">
    <div class="cal-card">
      <div class="cal-header">
        <h2 id="calLabel">—</h2>
        <div class="cal-nav">
          <button id="prevBtn" aria-label="Previous month">‹</button>
          <button id="todayBtn" aria-label="Jump to today">•</button>
          <button id="nextBtn" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="list-section" id="listSection">
      <h3 id="listTitle">—</h3>
      <p class="list-sub" id="listSub"></p>
      <div class="chips" id="fullChips"></div>
    </div>
  </div>

  <footer>
    Today Celebrates — currently covering September &amp; October 2026, with more days on the way.
  </footer>

<script>
  // ---- Data: { "YYYY-M-D": ["Event 1", "Event 2", ...] } ----
  // Index 0 in each list is treated as the day's "leading" celebration for the hero.

  // ---- Hero background art, matched to the leading celebration by keyword ----
  const HERO_IMAGES = {
    coffee:      "/images/hero/coffee.jpg",
    beer:        "/images/hero/beer.jpg",
    food:        "/images/hero/food.jpg",
    dog:         "/images/hero/dog.jpg",
    community:   "/images/hero/community.jpg",
    books:       "/images/hero/books.jpg",
    kids:        "/images/hero/kids.jpg",
    nature:      "/images/hero/nature.jpg",
    tech:        "/images/hero/tech.jpg",
    music:       "/images/hero/music.jpg",
    sports:      "/images/hero/sports.jpg",
    health:      "/images/hero/health.jpg",
    halloween:   "/images/hero/halloween.jpg",
    celebration: "/images/hero/celebration.jpg"
  };

  const monthCache = {};
  function monthKey(year, month1){ return `${year}-${String(month1).padStart(2,"0")}`; }
  function loadMonth(year, month1){
    const mk = monthKey(year, month1);
    if (monthCache[mk]) return Promise.resolve(monthCache[mk]);
    return fetch(`/data/${mk}.json`)
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}))
      .then(data => { monthCache[mk] = data; return data; });
  }
  function dataFor(k){
    const [y, m] = k.split("-").map(Number);
    const month = monthCache[monthKey(y, m)];
    return month ? month[k] : undefined;
  }

  const CATEGORY_KEYWORDS = [
    ["coffee", ["coffee"]],
    ["beer", ["beer"]],
    ["halloween", ["halloween","pumpkin","candy corn","trick or treat","frankenstein","haunted","mischief night","black cat","ghost hunting","psychic powers","carve a pumpkin","howl at the moon"]],
    ["food", ["pizza","cheeseburger","burger","hoagie","taco","quesadilla","bacon","pie","donut","doughnut","pancake","waffle","cheese","chocolate","candy","cookie","dumpling","wiener","schnitzel","salami","rice","corned beef","lobster","samosa","popsicle","cider","milkshake","guacamole","snack stick","squash","acorn","macadamia","chianti","spice blend","ice cream","linguine","rarebit","hash","grilled chicken","tv dinner","cherries","pasta","meatloaf","nut"]],
    ["dog", ["dog","hound","puppy","canine","pet memorial"]],
    ["community", ["teddy bear","care bears","share your care","human family","gratitude","forgiveness","cleanup","volunteer","peace","unity","encouragement","kindness","neighbor","singles","compliance officer","situational awareness","brave day","non-violence"]],
    ["books", ["book","reading","library","punctuation","letter writing","storytelling","diary","comic"]],
    ["kids", ["kids","school","parent","grandparent","grandma","family","child","stepfamily","daughter","working parents","teacher"]],
    ["nature", ["beach","wildlife","hummingbird","elephant","nature","outside","tailgating","car free","equinox","hobbit","rhino","ozone","bamboo","refuge","public lands","legwear","centenarian","girls' night","animal"]],
    ["tech", ["video game","gaming","it professional","computer","tech","online learning","ampersand","dot day","ai in work","online recovery","silent e"]],
    ["music", ["music","dance","chai"]],
    ["sports", ["gymnastics","hunting","fishing","bowling","checkers","legwear","seat check"]],
    ["health", ["nurse","hiv","aids","cancer","health","awareness","sober","restless legs","narcolepsy","alzheimer","celiac","breast","fitness","recognition day"]]
  ];

  function getCategory(name){
    const lower = name.toLowerCase();
    for(const [cat, words] of CATEGORY_KEYWORDS){
      if(words.some(w => lower.includes(w))) return cat;
    }
    return "celebration";
  }

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOWS = ["S","M","T","W","T","F","S"];

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed
  let selectedKey = key(today.getFullYear(), today.getMonth()+1, today.getDate());

  function key(y,m,d){ return `${y}-${m}-${d}`; }

  function slugify(name){
    let s = name.toLowerCase();
    s = s.replace(/&/g, "and");
    s = s.replace(/['’]/g, "");
    s = s.replace(/[^a-z0-9]+/g, "-");
    s = s.replace(/^-+|-+$/g, "");
    s = s.replace(/-+/g, "-");
    return s;
  }
  function holidayUrl(name){ return `/holiday/${slugify(name)}/`; }
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function isTodayKey(k){ return key(today.getFullYear(), today.getMonth()+1, today.getDate()) === k; }

  function render(){
    renderCalendar();
    renderHero(selectedKey);
    renderList(selectedKey);
  }

  function renderHero(k){
    const [y,m,d] = k.split("-").map(Number);
    const dateObj = new Date(y, m-1, d);
    const events = dataFor(k);

    document.getElementById("heroDateBadge").textContent = dateObj.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });

    const hero = document.getElementById("hero");
    if(events && events.length){
      const lead = events[0];
      hero.style.backgroundImage = `url("${HERO_IMAGES[getCategory(lead)]}")`;
      document.getElementById("heroEyebrow").textContent = isTodayKey(k) ? "Today's leading celebration" : "Leading celebration this day";
      document.getElementById("heroHeadline").innerHTML = `<a href="${holidayUrl(lead)}">${escapeHtml(lead)}</a>`;
      const restCount = events.length - 1;
      document.getElementById("heroSub").textContent = restCount > 0
        ? `Plus ${restCount} more ${restCount === 1 ? "celebration" : "celebrations"} on ${dateObj.toLocaleDateString(undefined,{month:'long', day:'numeric'})}.`
        : `The only celebration on the calendar for ${dateObj.toLocaleDateString(undefined,{month:'long', day:'numeric'})}.`;
      document.getElementById("heroMoreBtn").style.display = restCount > 0 ? "inline-flex" : "none";
    } else {
      hero.style.backgroundImage = `url("${HERO_IMAGES.celebration}")`;
      document.getElementById("heroEyebrow").textContent = "No data yet";
      document.getElementById("heroHeadline").textContent = dateObj.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
      document.getElementById("heroSub").textContent = "No holidays logged for this day yet.";
      document.getElementById("heroMoreBtn").style.display = "none";
    }
  }

  function renderList(k){
    const [y,m,d] = k.split("-").map(Number);
    const dateObj = new Date(y, m-1, d);
    const events = dataFor(k);
    const dateLabel = dateObj.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

    document.getElementById("listTitle").textContent = `Everything ${dateLabel} celebrates`;
    const chipsEl = document.getElementById("fullChips");
    chipsEl.innerHTML = "";

    if(events && events.length){
      document.getElementById("listSub").textContent = `${events.length} ${events.length === 1 ? "celebration" : "celebrations"} on the calendar.`;
      events.forEach((ev, i)=>{
        const c = document.createElement("a");
        c.className = "chip" + (i === 0 ? " lead" : "");
        c.href = holidayUrl(ev);
        c.textContent = ev;
        chipsEl.appendChild(c);
      });
    } else {
      document.getElementById("listSub").textContent = "";
      const p = document.createElement("div");
      p.className = "empty-note";
      p.textContent = "No holidays logged for this day yet.";
      chipsEl.appendChild(p);
    }
  }

  function renderCalendar(){
    document.getElementById("calLabel").textContent = `${MONTHS[viewMonth]} ${viewYear}`;
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    DOWS.forEach(d=>{
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const viewedMonthData = monthCache[monthKey(viewYear, viewMonth+1)] || {};

    for(let i=0;i<firstDow;i++){
      const el = document.createElement("div");
      el.className = "day empty";
      grid.appendChild(el);
    }

    for(let d=1; d<=daysInMonth; d++){
      const k = key(viewYear, viewMonth+1, d);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "day";
      el.textContent = d;
      if(viewedMonthData[k]) el.classList.add("has-data");
      if(isTodayKey(k)) el.classList.add("today");
      if(k === selectedKey) el.classList.add("selected");
      el.addEventListener("click", ()=>{
        selectedKey = k;
        render();
      });
      grid.appendChild(el);
    }
  }

  document.getElementById("prevBtn").addEventListener("click", ()=>{
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    loadMonth(viewYear, viewMonth+1).then(renderCalendar);
  });
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    loadMonth(viewYear, viewMonth+1).then(renderCalendar);
  });
  document.getElementById("todayBtn").addEventListener("click", ()=>{
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    selectedKey = key(today.getFullYear(), today.getMonth()+1, today.getDate());
    loadMonth(viewYear, viewMonth+1).then(render);
  });
  document.getElementById("heroMoreBtn").addEventListener("click", ()=>{
    document.getElementById("listSection").scrollIntoView({ behavior:"smooth", block:"start" });
  });

  loadMonth(viewYear, viewMonth+1).then(render);
</script>
</body>
</html>
