<!DOCTYPE html>
<html lang="en" class="<!--TC:HTML_CLASS-->">
<head>
<!--TC-ONLY
  SOURCE TEMPLATE — edit this file, not public/index.html.

  generate.py renders this into public/index.html on every run, replacing each
  TC: marker with today's real content, so crawlers (and anyone with JS off)
  get the actual holiday names in the HTML. The interactive calendar below
  still re-renders the same content client-side once it loads; the baked
  markup is what the page is before that happens, and it must match. If you
  change the row, calendar or heading markup here, change obs_row() /
  calendar_html() in generate.py to match (and vice versa).

  Shared chrome (head, header, footer, scripts) lives in templates/partials/.

  This block is stripped from the generated output.
-->
<!--TC:GENERATED_NOTE-->
<!--TC:HEAD_COMMON-->
<title><!--TC:TITLE--></title>
<link rel="canonical" href="https://todaycelebrates.com/">
<meta name="description" content="<!--TC:DESCRIPTION-->">
<meta property="og:type" content="website">
<meta property="og:title" content="<!--TC:TITLE-->">
<meta property="og:description" content="<!--TC:DESCRIPTION-->">
<meta property="og:image" content="<!--TC:IMAGE_ABS-->">
<meta property="og:url" content="https://todaycelebrates.com/">
<meta property="og:site_name" content="Today Celebrates">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="<!--TC:TITLE-->">
<meta name="twitter:description" content="<!--TC:DESCRIPTION-->">
<meta name="twitter:image" content="<!--TC:IMAGE_ABS-->">
</head>
<body>
<!--TC:SITE_HEADER-->
<div class="wrap">
  <div class="ad-slot ad-leaderboard" data-ad-slot="leaderboard" data-ad-eager="1"></div>
  <div class="layout">
    <main id="main" data-day-from="<!--TC:DAY_FROM-->" data-day-to="<!--TC:DAY_TO-->" data-today="<!--TC:TODAY_KEY-->">
      <div class="pagehead"><h1 id="listTitle"><!--TC:H1_TEXT--></h1><span class="count mono" id="listCount"><!--TC:COUNT_TEXT--></span></div>
      <div class="lead" id="leadBox" data-u="<!--TC:LEAD_SHARE_URL-->" data-n="<!--TC:LEAD_SHARE_TITLE-->"<!--TC:LEAD_HIDDEN-->>
        <div><small>Leading celebration</small><b id="leadName"><!--TC:LEAD_NAME--></b></div>
        <div class="acts"><a class="btn pri" id="leadOpen" href="<!--TC:LEAD_HREF-->">Open</a><button type="button" class="btn" data-a="share"><svg width="16" height="16" aria-hidden="true"><use href="#i-share"/></svg><span id="leadShareLabel"><!--TC:LEAD_SHARE_LABEL--></span></button></div>
      </div>
      <table class="obs" id="obsTable"<!--TC:TABLE_HIDDEN-->>
        <thead><tr><th scope="col">#</th><th scope="col">Observance</th><th scope="col">Category</th><th scope="col"><span class="sr">Actions</span></th></tr></thead>
        <tbody id="obsBody"><!--TC:ROWS--></tbody>
      </table>
      <p class="empty-note" id="emptyNote"<!--TC:EMPTY_HIDDEN-->>No holidays logged for this day yet.</p>
      <p class="day-permalink" id="dayLink"><!--TC:DAY_LINK--></p>
      <div class="ad-slot ad-rect" data-ad-slot="footer"></div>
    </main>

    <aside class="left" id="calendar" aria-label="Calendar">
      <div class="box">
        <div class="ch"><button type="button" id="prevBtn" aria-label="Previous month">&lsaquo;</button><strong class="mono" id="calLabel"><!--TC:CAL_LABEL--></strong><button type="button" id="nextBtn" aria-label="Next month">&rsaquo;</button></div>
        <div class="g mono" id="grid"><!--TC:CAL_GRID--></div>
      </div>
      <h2>Jump to month</h2>
      <div class="mo" id="monthJump"><!--TC:MONTH_JUMP--></div>
    </aside>

    <aside class="right" aria-label="Coming up">
      <div class="up"><h2>Coming up</h2><!--TC:COMING_UP--></div>
      <div class="ad-rail" data-ad-slot="rail"></div>
    </aside>
  </div>
</div>
<!--TC:SITE_FOOTER-->
<!--TC:SITE_SCRIPTS-->

<script>
(function () {
  "use strict";
  // The page ships with today's list, calendar and heading already in the HTML.
  // This script only takes over when the visitor picks another day or month,
  // or when their own clock says it is a different day than the one that was
  // baked. Its markup MUST stay identical to obs_row() / calendar_html() in
  // scripts/generate.py.
  var CATS = <!--TC:CAT_JSON-->;
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  var root = document.getElementById("main");
  var DAY_FROM = root.dataset.dayFrom, DAY_TO = root.dataset.dayTo;
  var cache = {};
  var now = new Date();
  var todayKey = key(now.getFullYear(), now.getMonth() + 1, now.getDate());
  var viewYear = now.getFullYear(), viewMonth = now.getMonth();
  var selectedKey = todayKey;

  function key(y, m, d) { return y + "-" + m + "-" + d; }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function iso(k) { var p = k.split("-").map(Number); return p[0] + "-" + pad2(p[1]) + "-" + pad2(p[2]); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function mkey(y, m1) { return y + "-" + pad2(m1); }

  function load(y, m1) {
    var mk = mkey(y, m1);
    if (cache[mk]) return Promise.resolve(cache[mk]);
    return fetch("/data/v2/" + mk + ".json")
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(function (d) { cache[mk] = d; return d; });
  }
  function dataFor(k) {
    var p = k.split("-").map(Number);
    var month = cache[mkey(p[0], p[1])];
    return month ? month[k] : undefined;
  }

  function btn(a, label, icon, extra) {
    return '<button type="button" class="ib' + (extra || "") + '" data-a="' + a + '" aria-label="' + esc(label) + '">' +
           '<svg width="17" height="17" aria-hidden="true"><use href="#' + icon + '"/></svg></button>';
  }
  function obsRow(it, i, isoDate) {
    var n = it[0], s = it[1], c = CATS[it[2]] || [it[2], "lil"];
    return '<tr data-u="/holiday/' + s + '/" data-n="' + esc(n) + '" data-d="' + isoDate + '" data-y="' + it[3] + '"' + (i === 0 ? ' class="hot"' : "") + '>' +
      '<td class="n mono">' + pad2(i + 1) + '</td>' +
      '<td class="nm"><a href="/holiday/' + s + '/">' + esc(n) + '</a>' + (i === 0 ? '<span class="lbl">Lead</span>' : "") + '</td>' +
      '<td class="cat"><span class="pill ' + c[1] + '">' + esc(c[0]) + '</span></td>' +
      '<td class="act">' + btn("copy", "Copy link to " + n, "i-link") + btn("ics", "Add " + n + " to calendar", "i-cal") + btn("share", "Share " + n, "i-share", " sh") + '</td></tr>';
  }

  function renderDay(k) {
    var p = k.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    var dayText = WEEKDAYS[dt.getDay()] + (k === todayKey ? " " : ", ") + MONTHS[p[1] - 1] + " " + p[2];
    var events = dataFor(k) || [];
    var isoDate = iso(k);
    document.getElementById("listTitle").textContent = (k === todayKey ? "Today, " : "") + dayText;
    document.getElementById("listCount").textContent = events.length ? events.length + (events.length === 1 ? " observance" : " observances") : "";

    var lead = document.getElementById("leadBox"), table = document.getElementById("obsTable"), empty = document.getElementById("emptyNote");
    if (events.length) {
      var l = events[0];
      lead.hidden = false; table.hidden = false; empty.hidden = true;
      document.getElementById("leadName").textContent = l[0];
      document.getElementById("leadOpen").href = "/holiday/" + l[1] + "/";
      var inRange = isoDate >= DAY_FROM && isoDate <= DAY_TO;
      lead.dataset.u = k === todayKey ? "/" : (inRange ? "/day/" + isoDate + "/" : "/#" + k);
      lead.dataset.n = k === todayKey ? "What holiday is today? " + dayText : "Holidays on " + dayText;
      document.getElementById("leadShareLabel").textContent = k === todayKey ? "Share today" : "Share this day";
      document.getElementById("obsBody").innerHTML = events.map(function (it, i) { return obsRow(it, i, isoDate); }).join("");
    } else {
      lead.hidden = true; table.hidden = true; empty.hidden = false;
      document.getElementById("obsBody").innerHTML = "";
    }
    var link = document.getElementById("dayLink");
    link.innerHTML = (isoDate >= DAY_FROM && isoDate <= DAY_TO && events.length)
      ? '<a href="/day/' + isoDate + '/">Permanent page for ' + MONTHS[p[1] - 1] + " " + p[2] + ", " + p[0] + " →</a>" : "";
  }

  function renderCalendar() {
    document.getElementById("calLabel").textContent = MON[viewMonth] + " " + viewYear;
    var first = new Date(viewYear, viewMonth, 1).getDay();
    var days = new Date(viewYear, viewMonth + 1, 0).getDate();
    var data = cache[mkey(viewYear, viewMonth + 1)] || {};
    var h = "";
    "SMTWTFS".split("").forEach(function (w) { h += '<span class="w">' + w + "</span>"; });
    for (var i = 0; i < first; i++) h += "<span></span>";
    for (var d = 1; d <= days; d++) {
      var k = key(viewYear, viewMonth + 1, d);
      h += '<button type="button" class="d' + (data[k] ? " has" : "") + (k === todayKey ? " t" : "") + (k === selectedKey ? " sel" : "") +
           '" data-k="' + k + '" aria-label="' + MONTHS[viewMonth] + " " + d + '"' + (k === selectedKey ? ' aria-pressed="true"' : "") + (k === todayKey ? ' aria-current="date"' : "") + ">" + d + "</button>";
    }
    document.getElementById("grid").innerHTML = h;
    var mj = document.querySelectorAll("#monthJump button");
    for (var m = 0; m < mj.length; m++) mj[m].classList.toggle("t", m === viewMonth);
  }

  function show(k, openMonth) {
    var p = k.split("-").map(Number);
    selectedKey = k;
    if (openMonth) { viewYear = p[0]; viewMonth = p[1] - 1; }
    Promise.all([load(p[0], p[1]), load(viewYear, viewMonth + 1)]).then(function () { renderDay(k); renderCalendar(); });
  }
  function gotoMonth(y, m0) {
    viewYear = y; viewMonth = m0;
    load(y, m0 + 1).then(renderCalendar);
  }

  document.getElementById("grid").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-k]");
    if (b) show(b.dataset.k, false);
  });
  document.getElementById("prevBtn").addEventListener("click", function () {
    var m = viewMonth - 1, y = viewYear; if (m < 0) { m = 11; y--; } gotoMonth(y, m);
  });
  document.getElementById("nextBtn").addEventListener("click", function () {
    var m = viewMonth + 1, y = viewYear; if (m > 11) { m = 0; y++; } gotoMonth(y, m);
  });
  document.getElementById("monthJump").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var m = Array.prototype.indexOf.call(b.parentNode.children, b);
    // Month files cover the next twelve months, so a month already past this
    // year means next year's.
    gotoMonth(m >= now.getMonth() ? now.getFullYear() : now.getFullYear() + 1, m);
  });

  function fromHash() {
    var m = /^#(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(location.hash);
    if (!m) return false;
    show(key(+m[1], +m[2], +m[3]), true);
    return true;
  }
  window.addEventListener("hashchange", fromHash);

  if (!fromHash()) {
    if (todayKey === root.dataset.today) {
      // The baked page already is today: leave the DOM alone (no re-render,
      // so nothing can shift) and just warm the month data for later clicks.
      load(viewYear, viewMonth + 1);
    } else {
      show(todayKey, true);
    }
  }
})();
</script>
</body>
</html>
