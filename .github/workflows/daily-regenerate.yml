name: Daily site regeneration

# Runs once a day, pulls the approved Notion rows, regenerates the static
# site via scripts/generate.py, and pushes straight to main (Cloudflare
# Workers Build auto-deploys on push, same as a manual push from GitHub
# Desktop). Most days this is a no-op diff-wise -- the generator only
# changes a holiday's page/data-file entry when its date actually rolled
# into a new year, or when a Notion edit changed something. See
# scripts/README.md for what this depends on and how to set it up.
#
# 08:00 UTC is early morning US Eastern (~3-4am, depending on DST) --
# chosen so a holiday that rolled to a new year overnight is already live
# before the US workday starts, without needing two DST-aware schedules.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull fresh holidays.json from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/export_from_notion.py scripts/holidays.json

      - name: Regenerate site
        run: |
          python3 scripts/generate.py \
            --holidays scripts/holidays.json \
            --site public \
            --today "$(date -u +%F)" \
            --report /tmp/report.json
          echo "----- generation report -----"
          cat /tmp/report.json

      - name: Commit and push if anything changed
        run: |
          git config user.name "Today Celebrates bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes -- nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "Daily regeneration: $(date -u +%F)"
          git push
